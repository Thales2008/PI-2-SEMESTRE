<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta | Savi Mare Sociale</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <a href="index.html" class="logo">
            Savi Mare <span>Sociale</span>
        </a>

        <nav>
            <a href="index.html#gravatas">Gravatas</a>
            <a href="index.html#mais-vendidas">Mais vendidas</a>
            <a href="sobre.html">Sobre</a>
        </nav>

        <div class="header-actions">

            <a href="login.html" class="header-link">
                Entrar
            </a>

            <a href="index.html" class="header-button">
                Voltar à loja
            </a>

        </div>

    </header>


    <main>

        <section class="auth-section">

            <div class="auth-card">

                <div class="section-label">
                    Nova conta
                </div>

                <h1 class="auth-title">
                    Crie sua conta
                </h1>

                <p class="auth-subtitle">
                    Leva menos de um minuto e você ganha 10% de desconto
                    na primeira compra.
                </p>

                <form class="auth-form" action="#" method="post">

                    <label class="field">
                        <span>Nome completo</span>
                        <input
                            type="text"
                            name="nome"
                            placeholder="Seu nome completo"
                            required>
                    </label>

                    <label class="field">
                        <span>E-mail</span>
                        <input
                            type="email"
                            name="email"
                            placeholder="seu@email.com"
                            required>
                    </label>

                    <label class="field">
                        <span>Telefone</span>
                        <input
                            type="tel"
                            name="telefone"
                            placeholder="(11) 90000-0000">
                    </label>

                    <label class="field">
                        <span>Senha</span>
                        <input
                            type="password"
                            name="senha"
                            placeholder="Crie uma senha"
                            minlength="6"
                            required>
                    </label>

                    <label class="field">
                        <span>Confirmar senha</span>
                        <input
                            type="password"
                            name="confirmar-senha"
                            placeholder="Repita a senha"
                            minlength="6"
                            required>
                    </label>

                    <label class="checkbox-field">
                        <input type="checkbox" name="termos" required>
                        <span>Aceito os termos de uso e a política de privacidade.</span>
                    </label>

                    <button type="submit" class="button button-dark auth-submit">
                        Criar conta
                    </button>

                </form>

                <p class="auth-footer-text">
                    Já tem uma conta?
                    <a href="login.html">Entrar</a>
                </p>

            </div>

        </section>

    </main>


    <footer>

        <div class="footer-bottom">

            <span>
                © 2026 Savi Mare Sociale
            </span>

            <span>
                Gravatas sociais slim
            </span>

        </div>

    </footer>

</body>

</html>
